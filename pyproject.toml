[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronolattice"
version = "0.1.0"
description = "ChronoLattice v0.1 deterministic reconstruction core"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "ChronoLattice"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
chronolattice = "chronolattice.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
